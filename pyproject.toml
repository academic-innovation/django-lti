[project]
name = "django-lti"
version = "0.10.1"
description = "LTI tool support for Django"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=5.2",
    "pylti1p3>=2.0",
]

[project.urls]
Homepage = "https://github.com/academic-innovation/django-lti"
Documentation = "https://academic-innovation.github.io/django-lti/"

[dependency-groups]
dev = [
    "django-stubs>=5.1,<7",
    "factory-boy==3.3.3",
    "mypy==2.4.0",
    "nox[uv]==2026.8.17",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]
docs = [
    "furo==2025.12.19",
    "Sphinx==7.2.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lti_tool"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = [
    "E501",  # Line too long
    "I",    # isort (https://docs.astral.sh/ruff/rules/#isort-i)
    "D",    # pydocstyle (https://docs.astral.sh/ruff/rules/#pydocstyle-d)
    "B",    # flake8-bugbear (https://docs.astral.sh/ruff/rules/#flake8-bugbear-b)
    "A",    # flake8-builtins (https://docs.astral.sh/ruff/rules/#flake8-builtins-a)
    "C4",   # flake8-comprehensions (https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4)
    "T20",  # flake8-print (https://docs.astral.sh/ruff/rules/#flake8-print-t20)
    "DJ",   # flake8-django (https://docs.astral.sh/ruff/rules/#flake8-django-dj)
    "SIM",  # flake8-simplify (https://docs.astral.sh/ruff/rules/#flake8-simplify-sim)
    "PLC",  # pylint convention (https://docs.astral.sh/ruff/rules/#convention-plc)
    "UP",   # pyupgrade (https://docs.astral.sh/ruff/rules/#pyupgrade-up)
    "FIX001",  # flake8-fixme: line contains FIXME (https://docs.astral.sh/ruff/rules/line-contains-fixme/)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "D206",  # Indent with spaces (redundant with formatter)
    "EXE001",  # Shebang is present but file is not executable
    "RUF012",  # Mutable default value for class attribute
]

[tool.ruff.lint.per-file-ignores]
"apps.py" = ["D"]
"*/migrations/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["docs/"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = [
    "factory.*",
    "jwcrypto.*",
    "setuptools.*"
]
ignore_missing_imports = true
