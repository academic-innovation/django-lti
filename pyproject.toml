[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = [
    "E501",  # Line too long
    "I",    # isort (https://docs.astral.sh/ruff/rules/#isort-i)
    "D",    # pydocstyle (https://docs.astral.sh/ruff/rules/#pydocstyle-d)
    "B",    # flake8-bugbear (https://docs.astral.sh/ruff/rules/#flake8-bugbear-b)
    "A",    # flake8-builtins (https://docs.astral.sh/ruff/rules/#flake8-builtins-a)
    "C4",   # flake8-comprehensions (https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4)
    "T20",  # flake8-print (https://docs.astral.sh/ruff/rules/#flake8-print-t20)
    "DJ",   # flake8-django (https://docs.astral.sh/ruff/rules/#flake8-django-dj)
    "SIM",  # flake8-simplify (https://docs.astral.sh/ruff/rules/#flake8-simplify-sim)
    "PLC",  # pylint convention (https://docs.astral.sh/ruff/rules/#convention-plc)
    "FIX001",  # flake8-fixme: line contains FIXME (https://docs.astral.sh/ruff/rules/line-contains-fixme/)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    "D206",  # Indent with spaces (redundant with formatter)
    "EXE001",  # Shebang is present but file is not executable
    "RUF012",  # Mutable default value for class attribute
]

[tool.ruff.lint.per-file-ignores]
"apps.py" = ["D"]
"*/migrations/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["docs/"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = [
    "factory.*",
    "jwcrypto.*",
    "setuptools.*"
]
ignore_missing_imports = true
