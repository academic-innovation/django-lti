name: Run quality checks
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked nox -s lint
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked nox -s format
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked nox -s types
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2.0", "6.0.0", "6.1.0"]
        exclude:
          - django: "6.0.0"
            python: "3.11"
          - django: "6.1.0"
            python: "3.11"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv run --locked nox -s "test(python='${{ matrix.python }}', django='${{ matrix.django }}')"
